name: Life Arc

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  life:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Проверка жизненной дуги
        run: node tools/probe/life.js
      - name: Проверка последствий поведения
        run: node tools/probe/consequences.js
      - name: Проверка отношений
        run: node tools/probe/relationships.js
      - name: Проверка постоянной памяти мира
        run: node tools/probe/world-memory.js
      - name: Проверка уникальных траекторий
        run: node tools/probe/trajectory.js
      - name: Проверка первого акта
        run: node tools/probe/act.js
      - name: Проверка событий Director
        run: node tools/probe/director-events.js
      - name: Проверка Director content pools
        run: node tools/probe/director-content.js
      - name: Проверка V3 глубокой непрерывности
        run: node tools/probe/v3-depth.js
      - name: Проверка интегрированной V3 непрерывности
        run: node tools/probe/v3-continuity.js
      - name: Проверка конфликтов органов
        run: node tools/probe/organ-conflicts.js
      - name: Проверка глубокой метаморфозы
        run: node tools/probe/metamorphosis.js
      - name: Проверка долгой тени босса
        run: node tools/probe/boss-shadow.js
      - name: Проверка пространственной памяти
        run: node tools/probe/spatial-memory.js
      - name: Проверка распределения рождений
        run: node tools/probe/spawn-distribution.js
      - name: Проверка V5 живого мира
        run: node tools/probe/v5-world.js
      - name: Проверка V6 тела и идентичности
        run: node tools/probe/v6-body.js
      - name: Проверка V6 презентации и migration
        run: node tools/probe/v6-signals.js
      - name: Проверка accessibility
        run: node tools/probe/accessibility.js
      - name: Проверка третьего акта
        run: node tools/probe/v7-climax.js
      - name: Проверка межжизненной линии V8
        run: node tools/probe/v8-lineage.js
      - name: Проверка второго акта V4: persistence + replay
        run: node tools/probe/v4-second-act.js
      - name: Проверка второго акта V4.3 depth
        run: node tools/probe/v4-depth.js
      - name: Проверка Release Candidate
        run: node tools/probe/release-candidate.js
      - name: Проверка RC hardening, localization, lifecycle и soak
        run: node --expose-gc tools/probe/rc-hardening.js
