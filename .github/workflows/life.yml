name: Life Arc

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  life:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Проверка жизненной дуги
        run: node tools/probe/life.js
      - name: Проверка последствий поведения
        run: node tools/probe/consequences.js
      - name: Проверка отношений
        run: node tools/probe/relationships.js
      - name: Проверка постоянной памяти мира
        run: node tools/probe/world-memory.js
      - name: Проверка уникальных траекторий
        run: node tools/probe/trajectory.js
      - name: Проверка первого акта
        run: node tools/probe/act.js
      - name: Проверка событий Director
        run: node tools/probe/director-events.js
      - name: Проверка Director content pools
        run: node tools/probe/director-content.js
      - name: Проверка V3 глубокой непрерывности
        run: node tools/probe/v3-depth.js
      - name: Проверка интегрированной V3 непрерывности
        run: node tools/probe/v3-continuity.js
      - name: Проверка конфликтов органов
        run: node tools/probe/organ-conflicts.js
      - name: Проверка глубокой метаморфозы
        run: node tools/probe/metamorphosis.js
      - name: Проверка долгой тени босса
        run: node tools/probe/boss-shadow.js
      - name: Проверка пространственной памяти
        run: node tools/probe/spatial-memory.js
