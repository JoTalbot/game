name: APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Проверки души
        run: |
          set -euo pipefail
          node tools/probe/run.js
          node tools/probe/v6-body.js
          node tools/probe/v6-body-visual.js
          node tools/probe/v6-signals.js
          node tools/probe/accessibility.js
          node tools/probe/v7-climax.js
          node tools/probe/v8-lineage.js
          node tools/probe/v4-second-act.js
          node tools/probe/v4-depth.js
          node tools/probe/release-candidate.js
          node tools/probe/touch-policy.js
          node tools/probe/touch-hysteresis.js
          node tools/probe/start-density.js
          node tools/probe/spawn-budget.js
          node --expose-gc tools/probe/rc-hardening.js

      - name: Живой запуск
        run: node tools/probe/boot.js

      - name: Сторож Android WebView
        run: bash tools/check-android-security.sh

      - name: Синхронизировать зеркало
        run: |
          set -euo pipefail
          rm -rf docs/play
          mkdir -p docs/play
          cp -a web/. docs/play/

      - name: Сторож расхождений
        run: bash tools/check-sync.sh

      - name: Android SDK (build-tools 34, platform 34)
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd "$SDK/cmdline-tools"
          curl -sSL -o cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest
          printf 'y\n%.0s' $(seq 1 50) | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" --licenses >/dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.IGRA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.IGRA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ -z "${KEYSTORE_B64:-}" || -z "${KEYSTORE_PASSWORD:-}" ]]; then
              echo "ERROR: release tag requires IGRA_KEYSTORE_B64 and IGRA_KEYSTORE_PASSWORD" >&2
              exit 1
            fi
            echo "$KEYSTORE_B64" | base64 -d > dist/release.keystore
            echo "release signing key loaded"
            echo "IGRA_SIGNING_MODE=release" >> "$GITHUB_ENV"
            echo "IGRA_KEYSTORE=$GITHUB_WORKSPACE/dist/release.keystore" >> "$GITHUB_ENV"
            echo "IGRA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "non-tag build: debug signing allowed"
          fi

      - name: Сборка APK
        run: bash tools/build-apk.sh

      - name: Имя версии
        id: ver
        run: |
          V=$(sed -n 's/^VNAME="\(.*\)"$/\1/p' tools/build-apk.sh | head -1)
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Проверить checksum artifact
        run: |
          set -euo pipefail
          test -s "dist/igra-${{ steps.ver.outputs.v }}.apk"
          test -s "dist/igra-${{ steps.ver.outputs.v }}.apk.sha256"
          sha256sum -c "dist/igra-${{ steps.ver.outputs.v }}.apk.sha256"

      - name: Забрать APK
        uses: actions/upload-artifact@v4
        with:
          name: igra-${{ steps.ver.outputs.v }}
          path: |
            dist/igra-${{ steps.ver.outputs.v }}.apk
            dist/igra-${{ steps.ver.outputs.v }}.apk.sha256
          if-no-files-found: error

      - name: Копия под постоянным именем
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp "dist/igra-${{ steps.ver.outputs.v }}.apk" dist/igra.apk

      - name: Прицепить к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/igra-${{ steps.ver.outputs.v }}.apk
            dist/igra-${{ steps.ver.outputs.v }}.apk.sha256
            dist/igra.apk
