name: APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Source provenance
        run: |
          set -euo pipefail
          echo "APK source commit: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Проверка production release authorization
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PHYSICAL_ANDROID_APPROVED: ${{ secrets.IGRA_PHYSICAL_ANDROID_RELEASE_APPROVED }}
          APPROVED_COMMIT: ${{ secrets.IGRA_RELEASE_APPROVED_COMMIT }}
          APPROVED_APK_SHA256: ${{ secrets.IGRA_RELEASE_APPROVED_APK_SHA256 }}
        run: |
          set -euo pipefail
          test "${PHYSICAL_ANDROID_APPROVED:-}" = "1" || {
            echo "ERROR: tagged release requires physical Android approval secret IGRA_PHYSICAL_ANDROID_RELEASE_APPROVED=1" >&2
            exit 1
          }
          test "${APPROVED_COMMIT:-}" = "$GITHUB_SHA" || {
            echo "ERROR: release approval is not bound to this exact source commit" >&2
            exit 1
          }
          printf '%s' "${APPROVED_APK_SHA256:-}" | grep -Eq '^[0-9a-fA-F]{64}$' || {
            echo "ERROR: IGRA_RELEASE_APPROVED_APK_SHA256 must be a 64-hex APK SHA-256" >&2
            exit 1
          }
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Проверки души
        run: |
          set -euo pipefail
          node tools/probe/run.js
          node tools/probe/v6-body.js
          node tools/probe/v6-body-visual.js
          node tools/probe/v6-signals.js
          node tools/probe/accessibility.js
          node tools/probe/v7-climax.js
          node tools/probe/v8-lineage.js
          node tools/probe/v4-second-act.js
          node tools/probe/v4-depth.js
          node tools/probe/release-candidate.js
          node tools/probe/touch-policy.js
          node tools/probe/touch-hysteresis.js
          node tools/probe/v3-047-touch-meaning.js
          node tools/probe/v3-048-performance.js
          node tools/probe/start-density.js
          node tools/probe/density-guard.js
          node tools/probe/spawn-budget.js
          node tools/probe/render-budget.js
          node tools/probe/v3-015-laws.js
          node tools/probe/v12-lineage.js
          node tools/probe/v13-knowledge.js
          node tools/probe/v14-director2.js
          node tools/probe/v15-finale.js
          node tools/probe/v16-presentation.js
          node tools/probe/v17-adaptive-audio.js
          node tools/probe/v18-experiments.js
          node tools/probe/v19-deep-simulation.js
          node tools/probe/v20-v22-hardening.js
          node tools/probe/v20-production-hardening.js
          node tools/probe/v20-experiment-hardening.js
          node tools/probe/v21-v22-gate.js
          node tools/probe/v22-regression-gate.js
          node tools/probe/v23-v25-release-gates.js
          node tools/probe/v23-v25-evidence.js
          node tools/probe/v9-v25-persistence.js
          node tools/probe/v9-v25-game-integration.js
          node --expose-gc tools/probe/rc-hardening.js
          node tools/probe/balance.js
      - name: Живой запуск
        run: node tools/probe/boot.js
      - name: Сторож Android WebView
        run: bash tools/check-android-security.sh
      - name: Синхронизировать зеркало
        run: |
          set -euo pipefail
          rm -rf docs/play
          mkdir -p docs/play
          cp -a web/. docs/play/
      - name: Сторож расхождений
        run: bash tools/check-sync.sh
      - name: Android SDK (build-tools 34, platform 34)
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd "$SDK/cmdline-tools"
          curl -sSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest
          printf 'y\n%.0s' $(seq 1 50) | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.IGRA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.IGRA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ -z "${KEYSTORE_B64:-}" || -z "${KEYSTORE_PASSWORD:-}" ]]; then
              echo "ERROR: release tag requires IGRA_KEYSTORE_B64 and IGRA_KEYSTORE_PASSWORD" >&2
              exit 1
            fi
            echo "$KEYSTORE_B64" | base64 -d > dist/release.keystore
            echo "release signing key loaded"
            echo "IGRA_SIGNING_MODE=release" >> "$GITHUB_ENV"
            echo "IGRA_KEYSTORE=$GITHUB_WORKSPACE/dist/release.keystore" >> "$GITHUB_ENV"
            echo "IGRA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "non-tag build: debug signing allowed"
          fi
      - name: Сборка APK
        run: bash tools/build-apk.sh
      - name: Имя версии
        id: ver
        run: |
          V=$(sed -n 's/^VNAME="\(.*\)"$/\1/p' tools/build-apk.sh | head -1)
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - name: Проверить checksum artifact
        env:
          APPROVED_APK_SHA256: ${{ secrets.IGRA_RELEASE_APPROVED_APK_SHA256 }}
        run: |
          set -euo pipefail
          APK="dist/igra-${{ steps.ver.outputs.v }}.apk"
          test -s "$APK"
          test -s "${APK}.sha256"
          sha256sum -c "${APK}.sha256"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ACTUAL_SHA=$(sha256sum "$APK" | awk '{print $1}')
            test "$ACTUAL_SHA" = "${APPROVED_APK_SHA256,,}" || {
              echo "ERROR: built APK SHA-256 does not match physically approved artifact" >&2
              exit 1
            }
          fi
      - name: Забрать APK
        uses: actions/upload-artifact@v6
        with:
          name: igra-${{ steps.ver.outputs.v }}
          path: |
            dist/igra-${{ steps.ver.outputs.v }}.apk
            dist/igra-${{ steps.ver.outputs.v }}.apk.sha256
          if-no-files-found: error
      - name: Копия под постоянным именем
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp "dist/igra-${{ steps.ver.outputs.v }}.apk" dist/igra.apk
      - name: Прицепить к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/igra-${{ steps.ver.outputs.v }}.apk
            dist/igra-${{ steps.ver.outputs.v }}.apk.sha256
            dist/igra.apk
