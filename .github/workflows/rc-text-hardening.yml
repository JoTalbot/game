name: RC text hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove persistent world verse labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/js/renderer.js')
          s = p.read_text(encoding='utf-8')
          old = '''      if (b.verse && G.verseText(b.verse)) {
        ctx.save();
        ctx.fillStyle = G.rgb(c[0], c[1], c[2], 0.92);
        ctx.font = "italic 19px 'Cormorant Garamond', serif";
        ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,0.9)";
        ctx.shadowBlur = 5;
        ctx.fillText(G.verseText(b.verse), p.x, p.y + r + 22);
        ctx.restore();
      }
'''
          new = '''      // RC readability: verses are memory, not permanent labels.
      // They are surfaced through interaction/UI instead of stacking over
      // every bloom on the canvas. This keeps the garden readable on phones.
'''
          if old not in s:
              raise SystemExit('expected bloom verse block not found')
          s = s.replace(old, new, 1)

          marker = '    // RC: one active verse at a time; never paint a text label per bloom.\n'
          anchor = '      // wounds\n'
          if marker not in s:
              insert = '''      // RC: one active verse at a time; never paint a text label per bloom.
      // The nearest bloom is surfaced only while the player is close enough;
      // the garden itself stays visual and uncluttered.
      var nearestVerse = null;
      var nearestVerseDist = Infinity;
      for (var vi = 0; vi < game.world.blooms.length; vi++) {
        var vb = game.world.blooms[vi];
        if (!vb.verse) continue;
        var vd = G.dist(game.player.x, game.player.y, vb.x, vb.y);
        if (vd < 150 && vd < nearestVerseDist) {
          nearestVerse = vb;
          nearestVerseDist = vd;
        }
      }
      if (nearestVerse && G.verseText(nearestVerse.verse)) {
        var vp = this.worldToScreen(cam, nearestVerse.x, nearestVerse.y);
        var va = G.clamp(1 - nearestVerseDist / 150, 0, 1);
        ctx.save();
        ctx.globalAlpha = va;
        ctx.fillStyle = G.rgb(238, 234, 250, 0.94);
        ctx.font = "italic 19px 'Cormorant Garamond', serif";
        ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,0.92)";
        ctx.shadowBlur = 7;
        ctx.fillText(G.verseText(nearestVerse.verse), vp.x, vp.y + 34);
        ctx.restore();
      }

'''
              if anchor not in s:
                  raise SystemExit('renderer insertion anchor not found')
              s = s.replace(anchor, insert + anchor, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/js/renderer.js
          git rm .github/workflows/rc-text-hardening.yml
          git commit -m 'fix: prevent world verse text stacking on mobile'
          git push
