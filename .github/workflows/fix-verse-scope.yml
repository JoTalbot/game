name: fix-verse-scope
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch renderer scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/js/renderer.js')
          s = p.read_text()
          old = 'this.drawBloom(ctx, cam, game.world.blooms[gi], t, game);'
          new = 'this.drawBloom(ctx, cam, game.world.blooms[gi], t, game, verseBloom, verseDist);'
          if s.count(old) != 1:
              raise SystemExit(f'expected one draw call, found {s.count(old)}')
          s = s.replace(old, new)
          old = 'drawBloom: function (ctx, cam, b, t, game) {'
          new = 'drawBloom: function (ctx, cam, b, t, game, verseBloom, verseDist) {'
          if s.count(old) != 1:
              raise SystemExit(f'expected one drawBloom signature, found {s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
          git diff -- web/js/renderer.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/js/renderer.js
          if git diff --cached --quiet; then
            echo "renderer scope already fixed"
            exit 0
          fi
          git commit -m "fix: pass verse focus into bloom renderer"
          git push origin HEAD:main
