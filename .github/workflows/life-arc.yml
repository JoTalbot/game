name: Life Arc Gate

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "*.md"
  workflow_dispatch:

jobs:
  life:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Life Arc probes
        run: |
          set -euo pipefail
          node tools/probe/life-workflow.js
          node tools/probe/release-workflow-contract-test.js
          find web/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          probes=(
            life.js consequences.js relationships.js world-memory.js trajectory.js act.js
            director-events.js director-content.js v3-depth.js v3-continuity.js organ-conflicts.js
            metamorphosis.js boss-shadow.js spatial-memory.js spawn-distribution.js v5-world.js
            v6-body.js v6-signals.js accessibility.js v7-climax.js v8-lineage.js
            v9-world.js v10-myth.js v11-first-session.js v11-long-session.js v11-accessibility.js v11-release-qa.js v9-v25-systems.js v9-v25-bridge.js v9-v25-persistence.js v9-v25-game-integration.js v23-v25-persistence-fuzz.js v19-deep-simulation.js
            v20-v22-hardening.js v20-production-hardening.js v20-experiment-hardening.js v21-v22-gate.js v23-v25-release-gates.js v23-v25-evidence.js release-candidate.js dense-interaction.js
            v3-046-telemetry.js v3-047-touch-meaning.js v3-048-performance.js v22-regression-gate.js balance.js v3-015-laws.js v12-lineage.js v13-knowledge.js v14-director2.js v15-finale.js v16-presentation.js v17-adaptive-audio.js v18-experiments.js
          )
          for probe in "${probes[@]}"; do
            node "tools/probe/$probe"
          done
          node --expose-gc tools/probe/rc-hardening.js
          node tools/probe/rc2-evidence.js > rc2-evidence.json
          node tools/probe/physical-android-evidence-test.js
          node tools/probe/validate-release-authorization-test.js
          bash tools/probe/physical-android-collector-test.sh
      - name: Upload RC2 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: igra-rc2-evidence
          path: rc2-evidence.json
          if-no-files-found: ignore
          retention-days: 14
