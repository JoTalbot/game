<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05060a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="ИГРА — онтогенетическая игра. Она рождается без жанра и выращивает механики из твоего внимания."
    />
    <title>ИГРА</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="assets/img/icon.png" />
    <link rel="apple-touch-icon" href="assets/img/icon.png" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/game.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="grain"></div>
      <div id="overlay">
        <div id="brand">ИГРА</div>
        <div id="hint"></div>
        <div id="hud-right">
          <button id="mute-btn" type="button">тишина</button>
          <button id="sigil-btn" type="button">сигила</button>
        </div>

        <section id="title-screen">
          <h1 id="word">ИГРА</h1>
          <p id="tag">она растёт из тебя</p>
          <div id="title-actions">
            <button id="btn-continue" type="button">вернуться</button>
            <button id="btn-born" type="button">родиться</button>
          </div>
          <p id="whisper">коснись пустоты</p>
        </section>

        <div id="veil">
          <p id="igra-line"></p>
        </div>

        <section id="sigil-screen">
          <canvas id="sigil-canvas" width="280" height="280"></canvas>
          <h2 id="sigil-name"></h2>
          <p id="sigil-sub"></p>
          <div id="sigil-stats"></div>
          <div id="sigil-actions">
            <button id="sigil-close" type="button">назад в берег</button>
            <button id="btn-forget" type="button">забыть меня</button>
          </div>
        </section>
      </div>
    </div>

    <script src="js/math.js"></script>
    <script src="js/dna.js"></script>
    <script src="js/save.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/igra.js"></script>
    <script src="js/world.js"></script>
    <script src="js/director.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
